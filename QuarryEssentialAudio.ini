; Essential Audio Enhancements for The Quarry: settings. Put this file next to X3DAudio1_7.dll.
; Restart the game after changing anything.
[Audio]
; Output: how the game's sound is laid out.
; auto        3D spatial sound when Windows spatial sound (Dolby Atmos, Windows Sonic,
;             DTS, for headphones or home theater) is on for the device; otherwise
;             the channel layout Windows mixes the device at, when that is wider
;             than the hardware; otherwise the game's own output.
; spatial     3D spatial sound: 7.1.4 plus individually positioned sounds.
;             Falls back to what auto would choose if spatial sound is off.
; 7.1, 5.1, quad
;             That speaker layout. If Windows does not accept it on the device,
;             the log says so and the layout Windows mixes at is used instead.
; stereo      Stereo, even on a surround device.
; headphones  3D spatial sound if available; otherwise stereo with headphone panning.
; mono        Everything mixed to one channel and played on both sides.
Output=auto

; Compression: the game compresses its whole mix on the way out (gently: 3:1 above
; -20 dB). off removes that compressor, for the game's full dynamic range; the
; limiter that protects against clipping stays, and dialogue keeps its own levelling.
; on          The game as designed.
; off         No master compression.
Compression=on

; Device: which output the game plays on. Leave it empty for the Windows default.
; Otherwise write part of the device's name, for example iD4 or Headphones. If no
; device matches, the log lists the names of the available devices.
Device=

; Dialogue: where voices come from.
; game        The game as designed: voices sound wide and central wherever the
;             speaker is, and only a little quieter far away.
; positional  Each voice comes from its character, as seen from the camera, and
;             gets quieter and more muffled with distance. Voices change sides
;             when the camera cuts to the other side of a conversation.
Dialogue=game

; The positional settings (used only with Dialogue=positional). Distances in metres.
; Spread: how wide a voice sounds, 0 = a single point, 100 = all around you.
; The game uses 75 close up, rising to 100.
DialogueSpreadNear=30
DialogueSpreadFar=5
DialogueSpreadFarAt=3
; Volume: no change closer than DialogueFalloffStart, then this many dB quieter
; each time the distance doubles, but never more than DialogueFalloffMax dB.
DialogueFalloffStart=2
DialogueFalloffPerDoubling=6
DialogueFalloffMax=12
; Muffling (0 = none, 100 = most): none closer than DialogueMuffleStart, rising
; to DialogueMuffleMax at DialogueMuffleFullAt and beyond.
DialogueMuffleStart=2
DialogueMuffleFullAt=20
DialogueMuffleMax=35
; Where all three end; nothing changes further away than this.
DialogueMaxDistance=20
