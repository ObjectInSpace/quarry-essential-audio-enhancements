; Quarry Spatial Audio settings. Put this file next to X3DAudio1_7.dll.
; Restart the game after changing anything.
[Audio]
; Output: what the game should send to Windows.
; auto        Spatial sound when Windows spatial sound (Dolby Atmos, Windows Sonic
;             or DTS) is on for your output device; otherwise surround when there is
;             a surround layout to use (see Speakers); otherwise the game's own output.
; spatial     Windows spatial sound: 7.1.4 plus individually positioned sounds.
;             Falls back to surround if spatial sound is off.
; surround    A surround channel layout (see Speakers).
; stereo      Stereo, even on a surround device.
; mono        Everything mixed to one channel and played on both sides, so no
;             sound is lost to one ear.
; headphones  Spatial sound if available; otherwise stereo with headphone panning.
Output=auto

; Speakers: the channel layout used for surround, and as the fallback if spatial
; sound fails. Not used for spatial sound itself: Windows places that.
; auto    The layout Windows mixes your device at, when it is wider than what the
;         device reports as its hardware (for example 7.1 with Atmos or Sonic on).
; stereo, quad, 5.1, 7.1
;         Use this layout. Set it if your speakers are not detected correctly.
;         If Windows does not accept the layout on your device, the mod says so in
;         QuarrySpatial.log and uses auto instead.
Speakers=auto
