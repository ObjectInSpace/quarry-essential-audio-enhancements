; Quarry Spatial Audio settings. Put this file next to X3DAudio1_7.dll.
[Audio]
; auto        Spatial sound when Windows spatial sound (Dolby Atmos, Windows Sonic
;             or DTS) is on for your output device; otherwise surround when Windows
;             mixes your device wider than its hardware; otherwise the game's own output.
; spatial     Windows spatial sound: 7.1.4 plus individually positioned sounds.
;             Falls back to surround if spatial sound is off.
; surround    The channel layout Windows mixes your device at (7.1 with Atmos/Sonic).
; stereo      Stereo, even on a surround device.
; headphones  Spatial sound if available; otherwise stereo with Wwise's headphone panning.
Output=auto
